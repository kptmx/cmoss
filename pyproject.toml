[project]
name = "cmoss"
version = "0.1.0"
description = "A Flet desktop client for OpenSubsonic media servers"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "kptmx" }
]
dependencies = [
    "flet>=0.86.5",
    "aiohttp>=3.14",
    "beautifulsoup4>=4.15",
    "python-mpv>=1.0.8",
    "pillow>=12.0",
]

[project.optional-dependencies]
linux = [
    "jeepney>=0.9",
]
windows = [
    "winrt-sdk>=2.0",
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.5",
    "flet-desktop>=0.86.5",
    "flet-web>=0.86.5",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=0.86.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.flet]
desktop_flavor = "light"    # Change to "full" to use flet-audio and flet-video
org = "dev.kptmx"
product = "cmoss"
company = "kptmx"
copyright = "Copyright (C) 2026 kptmx"

[tool.flet.app]
path = "."
